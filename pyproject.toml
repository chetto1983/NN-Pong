[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-pong"
version = "0.2.0"
description = "Pong e Snake controllati da reti ReLU con pesi costruiti analiticamente, senza training."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE", "snake_game/assets/OFL-Nunito.txt"]
authors = [{ name = "Davide Marchetto" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pygame>=2.6"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
nn-pong = "pong:main"
nn-snake = "snake:main"

[tool.setuptools]
py-modules = ["pong", "snake"]
packages = ["pong_game", "snake_game"]

[tool.setuptools.package-data]
snake_game = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B023: closures are called within the same loop iteration.
# B905: zips over fixed tuples; strict= adds noise without catching bugs.
ignore = ["B023", "B905"]

[tool.ruff.lint.per-file-ignores]
# Star re-exports of the configuration constants are part of the public API.
"pong.py" = ["F403", "F405"]
"pong_game/__init__.py" = ["F403"]
